channels:
 - conda-forge
 - bioconda
dependencies:
  # 2.31.1 rather than the container's 2.31.0: 2.31.0 pins libzlib <1.3,
  # which cannot coexist with samtools 1.23.1. Upstream 2.31.1 ships no
  # static binary, so the container stays on 2.31.0.
  - bedtools=2.31.1
  - samtools=1.23.1
  - htslib=1.23.1
